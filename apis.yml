name: Drivetime
description: >-
  Drivetime (Drive.fm) was a voice-activated, hands-free in-car entertainment platform founded in 2018 by
  Niko Vuori, Justin Cooper, and Cory Johnson (veterans of Zynga and Rocket Games). The consumer mobile app
  delivered interactive trivia games, storytelling, quizzes, news, and audiobooks designed to be safe to
  play while driving, running on Amazon Alexa and Google Assistant, and partnered with the Jeopardy game
  show for a channel narrated by Alex Trebek. The company raised roughly $15M across seed and later rounds,
  with backing from Canaan Partners, Makers Fund, the Amazon Alexa Fund, Google Assistant Investments,
  Sinai Ventures, Fuel Capital, and Access Ventures. Drivetime was a business-to-consumer product and never
  published a public developer API, SDK, or developer portal; as of this profiling the drive.fm / drivetime.fm
  domain and the associated App Store and Google Play listings no longer resolve, indicating the product has
  been discontinued.
